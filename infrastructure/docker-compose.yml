services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: mana_market_db
    restart: always
    environment:
      POSTGRES_USER: mana_user
      POSTGRES_PASSWORD: mana_password
      POSTGRES_DB: mana_market
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mana_user -d mana_market"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: mana_market_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Ingestion Worker (Batch process triggered by systemd)
  worker:
    build: 
      context: ../src/worker
    container_name: mana_market_worker
    environment:
      DB_DSN: "postgres://mana_user:mana_password@timescaledb:5432/mana_market"
    depends_on:
      timescaledb:
        condition: service_healthy
    profiles:
      - batch

  # FastAPI Core Backend (Persistent REST API)
  api:
    build:
      context: ../src/api
    container_name: mana_market_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      DB_DSN: "postgres://mana_user:mana_password@timescaledb:5432/mana_market"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  timescale_data: