name: Deploy to Debian

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Infrastructure and API
        run: |
          cd /opt/mana-market-engine/infrastructure
          
          # Pull latest commits
          git pull origin main
          
          # Build batch worker image for systemd execution
          docker compose --profile batch build worker
          
          # Rebuild and restart API and Tunnel services without downtime for database
          docker compose up -d --build api tunnel